name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Default-deny token: jobs that need more (e.g. rustsec/audit-check) opt in
# explicitly at job level. Anything else gets a read-only GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (pinned snapshot 2026-08-13; quarterly review moves it)
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      # unwrap_used/expect_used/panic are enforced tool-natively: they are
      # workspace lints (workspace Cargo.toml, every crate opts in via
      # [lints] workspace = true) and `-D warnings` promotes them to errors,
      # while clippy.toml's allow-*-in-tests keeps test code idiomatic.
      # A grep for ".unwrap()" cannot track #[cfg(test)] scope and produced
      # only false positives, so it was removed, not loosened.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Shell scripts: syntax (bash -n) + static analysis (shellcheck) +
      # formatting (shfmt, -i 4 -ci matches the repo's established style).
      # Gate added 2026-08-12; it immediately caught shesh-bootstrap.sh's
      # multi-line brace expansion, which bash could not parse at all.
      - name: Lint shell scripts (bash -n, shellcheck, shfmt)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck shfmt
          set -e
          mapfile -t SHELLS < <(git ls-files '*.sh' '*.bash')
          echo "shell files: ${SHELLS[*]}"
          for f in "${SHELLS[@]}"; do bash -n "$f"; done
          shellcheck "${SHELLS[@]}"
          shfmt -d -i 4 -ci "${SHELLS[@]}"

      # actionlint pinned at v1.7.12 (earlier versions ship a permissions
      # scope list that predates the documented `models` scope — false
      # positive on moderator-style workflows elsewhere in the org).
      - name: actionlint (workflows)
        run: |
          curl -sfL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml

  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (pinned snapshot 2026-08-13; quarterly review moves it)

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        run: cargo test --lib --workspace

      - name: Run integration tests
        run: cargo test --workspace --tests

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Report test count
        run: |
          TOTAL=$(cargo test --workspace 2>&1 | grep -oP '\d+(?= passed)' | paste -sd+ | bc)
          echo "Total tests: $TOTAL"
          if [ "$TOTAL" -lt 850 ]; then
            echo "::error::Test count ($TOTAL) dropped below 850. Measured 872 on 2026-08-12 post-excision (ADR-0018); the floor absorbs refactors, raise it when adding tests."
            exit 1
          fi

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (pinned snapshot 2026-08-13; quarterly review moves it)

      - name: Build workspace
        run: cargo build --workspace

      - name: Build release
        run: cargo build --release --workspace

  security:
    name: Security Audit
    runs-on: ubuntu-24.04
    # rustsec/audit-check publishes its report as a check run, which the
    # default read-only GITHUB_TOKEN cannot do.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1

      # .cargo/audit.toml documents the single researched exception
      # (RUSTSEC-2023-0071 rsa via russh: no patched release exists; the
      # vulnerable RSA private-key op is unreachable from our client-only
      # password-auth usage). Everything else fails the build.
      - name: Run cargo audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998  # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  supply-chain:
    name: Supply Chain (deny, machete, typos)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable (pinned snapshot 2026-08-13; quarterly review moves it)

      # Versions pinned to the local dev toolchain (scripts/bootstrap pins
      # the same). taiki-e/install-action fetches prebuilt release binaries
      # and checksum-verifies them.
      - uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833  # v2.87.1
        with:
          tool: cargo-deny@0.20.2,cargo-machete@0.9.2,typos-cli@1.49.0

      # deny.toml documents the two researched advisories ignores
      # (RUSTSEC-2023-0071 rsa — no patched release; RUSTSEC-2017-0008
      # serial — unreachable path via portable-pty), each with a re-check
      # trigger. wildcards = "deny" is why internal path deps carry
      # explicit versions. Everything else is a hard failure.
      - name: cargo deny (advisories, bans, licenses, sources)
        run: cargo deny check

      # No declared-but-unused dependencies (this gate is what keeps the
      # hand-drawn dependency graph in CONTRIBUTING.md honest).
      - name: cargo machete (unused declared deps)
        run: cargo machete

      # Source typo gate; _typos.toml holds only proper-noun exceptions.
      - name: typos (spell check)
        run: typos

  architecture:
    name: Architecture Validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1

      - name: Verify architecture artifact exists
        run: |
          if [ ! -f "docs/architecture.md" ]; then
            echo "::error::Missing docs/architecture.md artifact"
            exit 1
          fi

      - name: Validate Mermaid diagrams
        # NOTE: the pattern must be single-quoted — double quotes let bash
        # treat the backticks as command substitution and the step aborts
        # with "unexpected EOF" regardless of the file's contents.
        run: |
          if ! grep -q '^```mermaid' docs/architecture.md; then
            echo "::error::No Mermaid diagrams found in docs/architecture.md"
            exit 1
          fi
